# vmagent scrape configuration
# Reference: Module 4.3 of the training guide
#
# In the lab only the llm-simulator target exists. Real production targets
# (DCGM, vLLM, Ollama, LiteLLM) are kept as commented blocks so you can
# uncomment when the corresponding services are deployed.

global:
  scrape_interval: 15s
  external_labels:
    cluster: 'lab-llm'
    environment: 'lab'

scrape_configs:

  # === ACTIVE in the lab ===

  - job_name: 'llm-simulator'
    scrape_interval: 5s
    static_configs:
      - targets: ['llm-simulator:9100']
        labels:
          source: 'simulator'

  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['victoriametrics:8428']

  - job_name: 'vmalert'
    static_configs:
      - targets: ['vmalert:8880']

  # === COMMENTED -- uncomment in real production ===

