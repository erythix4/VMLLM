# OTel Collector for LLM observability
# Reference: Module 4.2 of the training guide
#
# IMPORTANT: this collector also handles ALL Prometheus-style scraping
# (since we observed that vmagent isn't reliably scraping in this lab).
# If you fix vmagent later, you can move these jobs back to prometheus.yml.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      global:
        scrape_interval: 10s
      scrape_configs:
        - job_name: llm-simulator
          scrape_interval: 5s
          static_configs:
            - targets: ['llm-simulator:9100']
        - job_name: victoriametrics
          metrics_path: /metrics
          static_configs:
            - targets: ['victoriametrics:8428']
        - job_name: vmagent
          metrics_path: /metrics
          static_configs:
            - targets: ['vmagent:8429']
        - job_name: vmalert
          metrics_path: /metrics
          static_configs:
            - targets: ['vmalert:8880']
        - job_name: otel-collector
          metrics_path: /metrics
          static_configs:
            - targets: ['otel-collector:8888']

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s, 10s]
    dimensions:
      - name: gen_ai.request.model
      - name: gen_ai.system
      - name: rag.index.id
      - name: rag.pipeline.id
      - name: rag.tenant.id

exporters:
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888

  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [spanmetrics, debug]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [prometheusremotewrite]
