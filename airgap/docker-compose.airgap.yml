# Lab 5 overlay -- adds MinIO (S3-compatible storage), vmbackup, and vmauth.
# Run together with the main compose:
#   docker compose -f docker-compose.yml -f airgap/docker-compose.airgap.yml up -d

services:

  # S3-compatible object storage for vmbackup snapshots
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: minio-airgap
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin12345
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Bootstrap: create the bucket once MinIO is ready
  minio-init:
    image: minio/mc:RELEASE.2024-04-18T16-45-29Z
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      sleep 5;
      mc alias set local http://minio:9000 admin admin12345;
      mc mb -p local/vm-backups || true;
      echo 'bucket vm-backups ready';
      "
    restart: 'no'

  # Periodic snapshot + push to S3
  vmbackup:
    image: victoriametrics/vmbackup:v1.99.0
    container_name: vmbackup-llm
    entrypoint: >
      sh -c "
      while true; do
        SNAP=$$(wget -qO- 'http://victoriametrics:8428/snapshot/create' | sed 's/.*\"snapshot\":\"//;s/\".*//');
        echo \"snapshot=$$SNAP\";
        /vmbackup-prod \
            -snapshotName=$$SNAP \
            -storageDataPath=/var/lib/vm-data \
            -dst=s3://vm-backups/auto \
            -customS3Endpoint=http://minio:9000 \
            -s3ForcePathStyle=true || true;
        wget -qO- \"http://victoriametrics:8428/snapshot/delete?snapshot=$$SNAP\" || true;
        sleep 300;
      done
      "
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=admin12345
    volumes:
      - vm-data:/var/lib/vm-data:ro
    depends_on:
      - victoriametrics
      - minio-init
    restart: unless-stopped

  # vmauth -- multi-role reverse proxy in front of VictoriaMetrics
  vmauth:
    image: victoriametrics/vmauth:v1.99.0
    container_name: vmauth-llm
    command: ['-auth.config=/etc/vmauth.yml']
    volumes:
      - ./airgap/vmauth.yml:/etc/vmauth.yml:ro
    ports:
      - '8427:8427'
    depends_on:
      - victoriametrics
    restart: unless-stopped

volumes:
  minio-data: {}
